<rect x="497.0" y="366" width="189.6" height="30" rx="15" fill="#16161a"/><circle cx="513.0" cy="381" r="4" fill="#7fc596"/><text x="525.0" y="386" font-size="13" font-weight="600" fill="#fff">Answers with evidence</text>
<text x="48" y="386" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#16161a" opacity=".5">CALLOUTS</text>
<g transform="translate(760.0 298)"><text font-size="40" font-weight="800" letter-spacing="-1.5" fill="#3e6b4f" y="40">3.0 s</text><text x="0" y="66" font-size="14" fill="#16161a" opacity=".65">snapped to whole beats, so the cut</text><text x="0" y="86" font-size="14" fill="#16161a" opacity=".65">lands on the music</text></g>
