<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="m" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" fill="#16161a"/></marker></defs>
<rect width="1280" height="440" rx="24" fill="#efede7"/>
<text x="48" y="58" font-size="26" font-weight="800" letter-spacing="-0.6" fill="#16161a">One shot: 7.3 s of real recording, 3 s on screen</text>
<text x="48" y="86" font-size="15" fill="#16161a" opacity=".6">Marks timestamp the real moments. Ramps fast-forward the waiting. Callouts land exactly on the event. (Illustrative timings.)</text>
<g font-size="13" font-weight="700" letter-spacing="1.4" fill="#16161a" opacity=".6"><text x="48" y="168">RECORDED</text><text x="48" y="336">IN THE CUT</text></g>
