<rect x="498.5" y="308" width="112.3" height="44" rx="9" fill="#3e6b4f"/><path d="M1059.1 188 L497.0 304" stroke="#16161a" stroke-opacity=".15" stroke-dasharray="4 4"/>
<path d="M1232.0 188 L612.3 304" stroke="#16161a" stroke-opacity=".15" stroke-dasharray="4 4"/>
