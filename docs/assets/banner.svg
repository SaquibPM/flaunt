<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#16161a" opacity=".07"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3e6b4f" stop-opacity=".16"/>
      <stop offset="1" stop-color="#3e6b4f" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#16161a" flood-opacity=".14"/>
    </filter>
    <clipPath id="win"><rect x="770" y="70" width="440" height="270" rx="16"/></clipPath>
  </defs>

  <rect width="1280" height="420" rx="24" fill="#efede7"/>
  <rect width="1280" height="420" rx="24" fill="url(#dots)"/>
  <circle cx="1040" cy="120" r="300" fill="url(#glow)"/>

  <!-- wordmark -->
  <g transform="translate(72 0)">
    <text x="0" y="150" font-size="96" font-weight="800" letter-spacing="-4" fill="#16161a">flaunt<tspan fill="#3e6b4f">.</tspan></text>
    <text x="2" y="206" font-size="30" font-weight="700" letter-spacing="-0.8" fill="#16161a">Your running app, cut into a</text>
    <text x="2" y="244" font-size="30" font-weight="700" letter-spacing="-0.8" fill="#3e6b4f">launch video.</text>
    <text x="2" y="290" font-size="17" fill="#16161a" opacity=".62">A Claude Code skill that reads your codebase first,</text>
    <text x="2" y="314" font-size="17" fill="#16161a" opacity=".62">then films the product doing what it does best.</text>

    <!-- stage chips -->
    <g font-size="14" font-weight="600" transform="translate(0 348)">
      <g><rect width="82" height="32" rx="16" fill="#16161a"/><text x="41" y="21" text-anchor="middle" fill="#efede7">read</text></g>
      <text x="92" y="21" fill="#16161a" opacity=".35">→</text>
      <g transform="translate(110 0)"><rect width="82" height="32" rx="16" fill="#16161a"/><text x="41" y="21" text-anchor="middle" fill="#efede7">rank</text></g>
      <text x="202" y="21" fill="#16161a" opacity=".35">→</text>
      <g transform="translate(220 0)"><rect width="82" height="32" rx="16" fill="#16161a"/><text x="41" y="21" text-anchor="middle" fill="#efede7">script</text></g>
      <text x="312" y="21" fill="#16161a" opacity=".35">→</text>
      <g transform="translate(330 0)"><rect width="82" height="32" rx="16" fill="#16161a"/><text x="41" y="21" text-anchor="middle" fill="#efede7">record</text></g>
      <text x="422" y="21" fill="#16161a" opacity=".35">→</text>
      <g transform="translate(440 0)"><rect width="82" height="32" rx="16" fill="#3e6b4f"/><text x="41" y="21" text-anchor="middle" fill="#ffffff">cut</text></g>
    </g>
  </g>

  <!-- product window mock -->
  <g filter="url(#sh)">
    <rect x="770" y="70" width="440" height="270" rx="16" fill="#ffffff"/>
  </g>
  <g clip-path="url(#win)">
    <rect x="770" y="70" width="440" height="34" fill="#f6f5f1"/>
    <circle cx="792" cy="87" r="5" fill="#e06c5d"/><circle cx="810" cy="87" r="5" fill="#e4b54a"/><circle cx="828" cy="87" r="5" fill="#6aae6a"/>
    <!-- chat input being typed -->
    <rect x="798" y="126" width="384" height="40" rx="20" fill="#f6f5f1" stroke="#16161a" stroke-opacity=".08"/>
    <text x="818" y="151" font-size="14" fill="#16161a" opacity=".75">What were our Scope 2 emissions?</text>
    <rect x="1040" y="138" width="2" height="17" fill="#3e6b4f"/>
    <circle cx="1162" cy="146" r="12" fill="#16161a"/><path d="M1157 146h10M1163 141l5 5-5 5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- result cards arriving -->
    <rect x="798" y="184" width="184" height="64" rx="10" fill="#f6f5f1"/>
    <rect x="812" y="198" width="30" height="30" rx="7" fill="#3e6b4f" opacity=".85"/>
    <rect x="852" y="201" width="110" height="9" rx="4" fill="#16161a" opacity=".55"/>
    <rect x="852" y="217" width="80" height="7" rx="3" fill="#16161a" opacity=".2"/>
    <rect x="998" y="184" width="184" height="64" rx="10" fill="#f6f5f1"/>
    <rect x="1012" y="198" width="30" height="30" rx="7" fill="#c46a6a" opacity=".8"/>
    <rect x="1052" y="201" width="104" height="9" rx="4" fill="#16161a" opacity=".55"/>
    <rect x="1052" y="217" width="70" height="7" rx="3" fill="#16161a" opacity=".2"/>
    <rect x="798" y="260" width="184" height="64" rx="10" fill="#f6f5f1" opacity=".6"/>
    <rect x="998" y="260" width="184" height="64" rx="10" fill="#f6f5f1" opacity=".6"/>
  </g>
  <!-- callout pill -->
  <g filter="url(#sh)">
    <rect x="992" y="236" width="196" height="34" rx="17" fill="#16161a"/>
  </g>
  <circle cx="1012" cy="253" r="4" fill="#7fc596"/>
  <text x="1024" y="258" font-size="14" font-weight="600" fill="#ffffff">Answers with evidence</text>
  <!-- cursor -->
  <path d="M1098 206 l0 22 l6 -5 l4 9 l4 -2 l-4 -9 l8 0 z" fill="#16161a" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- caption above window, like the real videos -->
  <text x="770" y="54" font-size="20" font-weight="800" letter-spacing="-0.5" fill="#16161a">Ask anything. <tspan fill="#3e6b4f">See the evidence.</tspan></text>

  <!-- timeline scrubber -->
  <g transform="translate(770 368)">
    <rect width="440" height="6" rx="3" fill="#16161a" opacity=".1"/>
    <rect width="150" height="6" rx="3" fill="#3e6b4f"/>
    <circle cx="150" cy="3" r="7" fill="#3e6b4f" stroke="#efede7" stroke-width="3"/>
    <text x="0" y="30" font-size="13" fill="#16161a" opacity=".5">0:11</text>
    <text x="440" y="30" font-size="13" fill="#16161a" opacity=".5" text-anchor="end">0:33 · beat-synced</text>
  </g>
</svg>
